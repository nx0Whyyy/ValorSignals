name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build dist

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: sky-signals
          path: |
            build/libs/ValorSky-SkySignals-*.jar
            !build/libs/*-plain.jar
            build/distributions/ValorSky-SkySignals-*.zip
