server:
  id: "SkyBlock-01"

debug: false

# Pack client requis pour afficher le modèle 3D de la météorite.
resource-pack:
  enabled: true
  url: "https://raw.githubusercontent.com/nx0Whyyy/ValorSignals/main/downloads/ValorSky-SkySignals-ResourcePack-2.1.6.zip"
  sha1: "22a6056d8fec32fd0b40858e146c9bce0f37cf67"
  required: true

scheduler:
  enabled: true
  min-interval: 300
  max-interval: 900
  allowed-events: []

event-weights:
  meteor: 30
  storm: 10
  sky_chest: 25
  mob_invasion: 15
  mineral_rain: 15
  growth_boost: 5

events:
  allow-concurrent: false
  max-active: 1

conflicts:
  meteor: []
  storm: []
  sky_chest: []
  mob_invasion: []
  mineral_rain: []
  growth_boost: []

cooldowns:
  global-event: 300
  player-participation: 60

visuals:
  enabled: true
  view-distance: 48
  particles:
    enabled: true
    max-per-second: 1000
  sounds:
    enabled: true
  titles:
    enabled: true
    fade-in: 10
    stay: 40
    fade-out: 20
  actionbar:
    enabled: true
  bossbar:
    enabled: true

performance:
  max-event-entities: 30
  max-mineral-items: 25

events-config:
  meteor:
    enabled: true
    duration: 180
    warning-duration: 15
    terrain-destruction: true
    allowed-blocks: []
    crater:
      enabled: true
      protect-worldguard-regions: true
      radius: 5
      depth: 3
      chest-enabled: true
      loot:
        DIAMOND: 3
        EMERALD: 6
        NETHERITE_SCRAP: 1
        GOLD_INGOT: 12
        IRON_INGOT: 24
        ENCHANTED_GOLDEN_APPLE: 1
    model:
      enabled: true
      item: MAGMA_BLOCK
      item-model: "skysignals:meteor"
      scale: 5.0
      rotation-speed: 4.0
      descent-duration: 8
      start-height: 100.0
      horizontal-distance: 80.0
      impact-item-model: "skysignals:meteor_impact"
      impact-scale: 1.5
      effects:
        enabled: true
        radius: 1.8
        flame-count: 12
        smoke-count: 6
        lava-count: 3
        trail-length: 10.0

  storm:
    enabled: true
    duration: 120

  sky_chest:
    enabled: true
    duration: 300

  mob_invasion:
    enabled: true
    duration: 300
    max-mobs: 20
    waves:
      - delay: 0
        mobs:
          ZOMBIE: 5
          SKELETON: 3
      - delay: 30
        mobs:
          ZOMBIE: 8
          SPIDER: 3
      - delay: 30
        mobs:
          CREEPER: 2
          SKELETON: 5

  mineral_rain:
    enabled: true
    duration: 120
    max-active-items: 25
    spawn-interval: 10

  growth_boost:
    enabled: true
    duration: 300
    multiplier: 2.0
    visual:
      particle-cooldown: 20

redis:
  enabled: true
  uri: "redis://localhost:6379"
  password: "${REDIS_PASSWORD}"
  channel: "valorsky.skysignals"

rabbitmq:
  enabled: true
  host: "localhost"
  port: 5672
  username: "${RABBITMQ_USERNAME}"
  password: "${RABBITMQ_PASSWORD}"
  exchange: "valorsky.skysignals"

database:
  host: "${DB_HOST}"
  port: 3306
  database: "valorsky"
  username: "${DB_USERNAME}"
  password: "${DB_PASSWORD}"
  pool-size: 10

cache:
  maximum-size: 100
  expire-after-minutes: 10

location:
  min-height: 60
  max-height: 250

testing:
  rewards: false
  announcements: true
  visuals: true
