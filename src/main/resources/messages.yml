prefix: "<gradient:#9333ea:#3b82f6>SkySignals</gradient>"

meteor:
  announcement: "<gradient:#9333ea:#3b82f6>☄ SIGNAL CÉLESTE</gradient>"
  start: "<yellow>Une anomalie vient d'être détectée dans l'atmosphère."
  warning: "<red>☄ Impact imminent !</red>\n<gray>Temps restant de l’événement : <yellow>%time%</yellow></gray>"
  coordinates: "<gray>📍 Impact : <yellow>X %x% <gray>•</gray> Y %y% <gray>•</gray> Z %z%</yellow> <dark_gray>(%world%)</dark_gray></gray>"
  impact: "<gold>💥 La météorite vient de frapper !"
  direction: "<gray>📍 Direction : <white>%direction%</white></gray>"
  crater: "<gold>☄ CRATÈRE MÉTÉORITIQUE\n<gray>Récompenses disponibles"
  finish: "<green>La météorite s'est dissipée."

storm:
  announcement: "<aqua>🌩 ANOMALIE MÉTÉOROLOGIQUE</aqua>"
  start: "<gray>Une tempête céleste approche..."
  transition: "<gray>Le ciel s'assombrit..."
  warning: "<yellow>⚡ La tempête éclate !"
  active: "<aqua>🌩 Orage céleste en cours"
  finish: "<green>La tempête commence à se dissiper."

sky_chest:
  announcement: "<gold>🎁 CAISSE CÉLESTE</gold>"
  descending: "<yellow>Une caisse mystérieuse descend du ciel..."
  beam: "<aqua>✨ Un faisceau lumineux marque l'emplacement"
  landing: "<gold>🎁 La caisse a atterri !"
  unlocking: "<yellow>🔒 Caisse céleste</yellow>\n<gray>Déverrouillage dans <yellow>%time%</yellow></gray>"
  unlocked: "<green>La caisse est maintenant déverrouillée !"
  claimed: "<gray>Cette caisse a déjà été récupérée."
  finish: "<green>La caisse céleste s'est évaporée."

mob_invasion:
  start: "<red>Une invasion se prépare ! Rejoignez la zone indiquée."
  announcement: "<red>👾 INVASION CÉLESTE</red>"
  wave: "<yellow>Vague <white>%wave%</white>/<white>%max%</white>"
  remaining: "<gray>Mobs restants : <white>%count%</white>"
  wave_cleared: "<green>Vague <white>%wave%</white> éliminée !"
  finish: "<green>L'invasion est repoussée."

mineral_rain:
  announcement: "<aqua>💎 PLUIE DE MINERAIS</aqua>"
  start: "<gray>Le ciel commence à laisser tomber des minerais..."
  active: "<aqua>💎 Pluie de minerais en cours"
  finish: "<green>La pluie de minerais est terminée."

growth_boost:
  announcement: "<green>🌱 CROISSANCE CÉLESTE</green>"
  start: "<gray>La nature semble accélérer..."
  active: "<green>🌱 Croissance céleste active"
  boosted: "<green>🌱 Votre culture a été boostée !"
  finish: "<green>La croissance céleste est terminée."

global:
  event_detected: "<gradient:#9333ea:#3b82f6>%symbol% %name%</gradient>\n<gray>%description%</gray>"
  direction_prefix: "📍 Direction : "

errors:
  no-permission: "<red>Vous n'avez pas la permission."
  event-not-found: "<red>Événement introuvable."
  event-already-active: "<red>Cet événement est déjà actif."
  infrastructure: "<red>Une dépendance externe est indisponible."
  invalid-location: "<red>Impossible de trouver un emplacement sûr."
  reward-already-claimed: "<red>Vous avez déjà réclamé cette récompense."

commands:
  reloaded: "<green>Configuration rechargée."
  event-started: "<green>Événement <white>%event%</white> démarré."
  event-stopped: "<green>Événement arrêté."
  test-started: "<green>Test de <white>%event%</white> lancé (sans récompenses)."
  history-header: "<gradient:#9333ea:#3b82f6>☁ HISTORIQUE SKY SIGNALS</gradient>"
  history-entry: "<gray>%symbol% <white>%name%</white> <dark_gray>- Il y a %time%</dark_gray>"
  debug-header: "<gradient:#9333ea:#3b82f6>SkySignals Debug</gradient>"
  info-header: "<gradient:#9333ea:#3b82f6>SkySignals Info</gradient>"

placeholders:
  active: "<green>Oui</green>"
  inactive: "<red>Non</red>"
  none: "<gray>Aucun</gray>"
# Localisation commune à tous les événements. Les événements mondiaux n'ont pas de point d'arrivée.
location:
  pending: "<gray>📍 Localisation en cours de recherche…</gray>"
  point: "<gray>📍 %label% <dark_gray>•</dark_gray> Monde : <aqua>%world%</aqua>\nX : <yellow>%x%</yellow> <dark_gray>•</dark_gray> Y : <yellow>%y%</yellow> <dark_gray>•</dark_gray> Z : <yellow>%z%</yellow></gray>"
  area: "<gray>📍 %label% <dark_gray>•</dark_gray> Monde : <aqua>%world%</aqua>\nX : <yellow>%x%</yellow> <dark_gray>•</dark_gray> Y : <yellow>%y%</yellow> <dark_gray>•</dark_gray> Z : <yellow>%z%</yellow> <dark_gray>•</dark_gray> Rayon : <yellow>%radius% blocs</yellow></gray>"
  world: "<gray>📍 %label% <dark_gray>•</dark_gray> Monde : <aqua>%world%</aqua></gray>"
