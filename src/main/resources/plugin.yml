name: ValorSky-SkySignals
version: ${version}
main: com.valorsky.skysignals.SkySignalsPlugin
api-version: '1.21'
folia-supported: true
author: ValorSky
description: Dynamic celestial events for ValorSky
softdepend: [PlaceholderAPI]
commands:
  skysignals:
    description: SkySignals main command
    usage: /skysignals <subcommand>
    aliases: [signals]
permissions:
  valorsky.skysignals.use:
    description: Use SkySignals
    default: true
  valorsky.skysignals.admin:
    description: Admin access to SkySignals
    default: op
  valorsky.skysignals.reload:
    description: Reload SkySignals
    default: op
  valorsky.skysignals.start:
    description: Start a SkySignals event
    default: op
  valorsky.skysignals.stop:
    description: Stop active SkySignals event
    default: op
  valorsky.skysignals.history:
    description: View SkySignals history
    default: true
  valorsky.skysignals.debug:
    description: Debug SkySignals
    default: op
  valorsky.skysignals.test:
    description: Test SkySignals events
    default: op